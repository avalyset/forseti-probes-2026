- id: SKATT-07
  domain: skatteetaten
  claim: '**Flytting innenlands**, lovtekst: «Den som endrer bosted innen en norsk kommune eller mellom
    norske kommuner, skal innen åtte dager etter flyttingen melde dette til skattekontoret.» **Ingen personlig
    oppmøte og ingen legitimasjonsplikt i lovteksten** — motsatt gren av SKATT-06 for lovtekstens del.
    **Merk:** forskriften stiller likevel krav, se SKATT-13 — lovtekst-påstanden er sann, men bærer ikke
    alene et svar på hva som kreves'
  legal_basis: folkeregisterloven § 6-1 (LOV-2016-12-09-88)
