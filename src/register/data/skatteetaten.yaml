- id: SKATT-17
  domain: skatteetaten
  claim: '**Innflytting, hovedregel i lovteksten**: «skal innen åtte dager etter ankomsten personlig melde
    dette på skattekontoret og vise frem pass eller tilsvarende legitimasjon». **Gjelder der forskriften
    § 6-5-4 ikke gjør unntak** — altså i praksis norske statsborgere som flytter hjem, ikke EØS-borgere
    (SKATT-12) og ikke utlendinger med meldeplikt til utlendingsmyndighetene (SKATT-11). Avløser den ufullstendige
    SKATT-06'
  legal_basis: folkeregisterloven § 6-2 (LOV-2016-12-09-88), lest sammen med folkeregisterforskriften
