- id: SKATT-06
  domain: skatteetaten
  claim: '**KORRIGERT 2026-08-27.** Tidligere ført som: «innflytting til Norge → åtte dager, personlig
    oppmøte, pass eller tilsvarende legitimasjon», uten forbehold. Lovteksten i § 6-2 er riktig sitert,
    men påstanden er **ufullstendig som fasit**: folkeregisterforskriften § 6-5-4 unntar utenlandske statsborgere
    med registrerings-/meldeplikt til utlendingsmyndighetene fra § 6-2-plikten helt, og gir EØS-borgere
    **tre måneder og åtte dager**, ikke åtte. Åttedagersfristen gjelder derfor ikke generelt for «innflytting
    til Norge». Erstattet av SKATT-11 og SKATT-12. Skal ikke bære et svar alene'
  legal_basis: folkeregisterloven § 6-2 (LOV-2016-12-09-88)
  register_status: '**KORRIGERT**'
  review_trigger: STABIL
  review_by: null
  section: Skatteetaten — legitimasjon ved fysisk oppmøte (verifisert 2026-08-27)
