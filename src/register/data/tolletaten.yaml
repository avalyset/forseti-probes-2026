- id: TOLL-07
  domain: tolletaten
  claim: '**DIVERGENS — etatssiden mot forskriften.** toll.no sier under «Verdigrense for turistar»: «Kvotene
    for alkohol, tobakk og matvarer gjeld for alle som reiser til Noreg, også turistar.» Lest i sammenheng
    kan setningen forsvares som «turistar er ikkje kvotefrie», men den naturlige lesningen er at samme
    kvote gjelder. Forskriften § 4-1-12 tredje ledd gir turister **dobbel** tobakks- og nikotinkvote (TOLL-06).
    En bruker som følger etatssiden får et annet svar enn forskriften gir. **Dokumenteres som divergens,
    ikke som feil hos noen part**'
  legal_basis: § 4-1-12 tredje ledd mot toll.no
