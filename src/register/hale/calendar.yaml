# Kjente endringsdatoer per registerrad. Halen kjorer bare rader som har
# passert datoen sin, slik at den ikke henter sider for en sats som ikke kan
# ha endret seg enna.
#
# month/day = arlig tilbakevendende dato. Ingen cron i denne runden;
# run.py --as-of DATE gjor valget eksplisitt.
rows:
  NAV-01: {month: 5, day: 1, why: "G fastsettes av Stortinget hver 1. mai"}
  NAV-02: {month: 5, day: 1, why: "6G folger G"}
  NAV-03: {month: 5, day: 1, why: "2,041G folger G"}
  NAV-04: {month: 5, day: 1, why: "2/3 av 2,041G folger G"}
  NAV-05: {month: 5, day: 1, why: "beregningssats, gjennomgaas med G"}
  NAV-06: {month: 1, day: 1, why: "barnetillegg er et kronebelop, justeres ved arsskiftet"}
  SKATT-18: {month: 1, day: 1, why: "personfradrag fastsettes i statsbudsjettet"}
  SKATT-19: {month: 1, day: 1, why: "minstefradrag fastsettes i statsbudsjettet"}
  SKATT-20: {month: 1, day: 1, why: "lovfestet grense; sjekkes arlig, endres sjelden"}
  HF-08: {month: 1, day: 1, why: "egenandelstaket fastsettes arlig av Stortinget"}
  HF-09: {month: 1, day: 1, why: "blareseptsatser endres ved arsskiftet"}
  LK-22: {month: 8, day: 1, why: "studiearet starter 1. august"}

# Lovtidend publiseres lopende, ikke pa en arlig dato. Den hentes derfor
# ukentlig framfor pa forfall, og impact.py kjores pa de nye kunngjoringene.
# Ingen cron: run.py --as-of styrer, og weekday er det as_of sammenlignes mot.
sources:
  lovtidend-avd1:
    cadence: weekly
    weekday: 1              # mandag (1 = mandag, ISO)
    archives:
      - lovtidend-avd1-2026.tar.bz2
    why: "Norsk Lovtidend avd. I kunngjores lopende; ukentlig henting fanger
      endringer innen en uke. Arsarkivet for inneverende ar oppdateres daglig
      kl. 01:31 UTC ifolge /list."
    then: "register/lovtidend/impact.py paa de nye kunngjoringene"
    license: "NLOD 2.0, jf. lovdata.no/info/vilkar § 2.3"
