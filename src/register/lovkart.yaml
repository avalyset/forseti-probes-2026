# ------------------------------------------------- grunnlaget ER en endring
#
# En tredje form for legal_basis, som verken er en stående bestemmelse eller
# et ikke-rettslig grunnlag: raden peker på ENDRINGSVEDTAKET, fordi påstanden
# handler om selve endringen («§ 18 andre og tredje ledd oppheves 1.8.2026»).
#
# Formen må løses til MÅLET, ikke til vedtaket. Et endringsvedtak endres
# aldri igjen — det er en hendelse, ferdig i det den er kunngjort. Å overvåke
# vedtaket ville gitt en rad som per konstruksjon aldri kan få treff.
# Paragrafen står i radens `claim`, ikke i `legal_basis`, og kan derfor ikke
# plukkes ut av hjemmelsfeltet alene.

grunnlag_er_endring:
  - rows: [LK-04]
    legal_basis: LOV-2026-06-19-60
    target_document: lov/2005-06-03-37
    target_paragraph: '18'
    note: >
      Raden er fasiten for LK-03 og LK-05: den sier hva som skjer med § 18 og
      hva som IKKE berøres (klageadgang, klagefrist, organets eksistens). En
      endring i utdanningsstøtteloven § 18 skal treffe alle tre.

# -------------------------------------------------------------- tvetydig
#
# Henvisninger som ikke kan løses til ett dokument uten et menneske.

tvetydig:
  - rows: [LK-22]
    legal_basis: forskrift om utdanningsstøtte 2026–2027
    problem: >
      Lest bokstavelig er dette en egen årlig forskrift. Lest i sammenheng med
      LK-11 — som fester samme basislånsats (15 488 kr/mnd) til
      FOR-2020-04-15-798 § 74 endret ved FOR-2026-04-24-649 — er det samme
      forskrift i 2026–27-utgave. Antakelsen er at det er det siste, men
      antakelsen er ikke verifisert.
    resolution_needed: >
      Slå opp om Lovdata fører en separat forskrift for studieåret 2026–2027
      eller bare endringsforskrifter til FOR-2020-04-15-798.

  - rows: [LK-12]
    legal_basis: forskrift
    problem: >
      Ingen paragraf, ingen forskrift navngitt. Raden er dessuten
      **UVERIFISERT** i registeret (formuesgrense 2026/27, eksakt beløp
      mangler). Dokument antatt FOR-2020-04-15-798 fra domenet.
    resolution_needed: Finn paragrafen for formuesgrense ved behovsprøving.

  - rows: [LK-09]
    legal_basis: forskrift om utdanningsstøtte
    problem: Dokument entydig, paragraf mangler helt.
    resolution_needed: Kan bare flagges på dokumentnivå til paragraf er fylt inn.

  - rows: [LK-10]
    legal_basis: forskrift, behovsprøving jf. lov § 7
    problem: >
      To dokumenter i ett felt. «lov § 7» er utdanningsstøtteloven § 7 og er
      løsbar; «forskrift» er det ikke.
    resolution_needed: Splitt feltet i to henvisninger.

  - rows: [HF-02]
    legal_basis: samme
    problem: >
      Rent markdown-artefakt: «samme» betyr «som raden over» og er bare
      meningsfullt i radrekkefølge. Løses til HF-01s grunnlag (rundskriv til
      ftrl. § 5-3), som ikke er lovtekst.
    resolution_needed: Erstatt med HF-01s grunnlag ordrett.

  - rows: [NB-15]
    legal_basis: '— (ISNI selv); pliktavleveringslova avgrenser hovedgrenen'
    problem: >
      Tankestreken betyr «ingen hjemmel» for hovedpåstanden (ISNI-tildeling er
      ISNI International Agencys sak). Pliktavleveringslova nevnes bare som
      avgrensning. En lovendring treffer avgrensningen, ikke påstanden.
    resolution_needed: >
      Avgjør om raden skal følge loven i det hele tatt. Antatt nei.

  - rows: [AT-04, TOLL-07]
    legal_basis: '§ … mot arbeidstilsynet.no / mot toll.no'
    problem: >
      Henvisningen bærer en sammenligning: paragrafen MOT etatssiden. Begge
      sider kan endres uavhengig, og raden handler om avviket mellom dem.
      Paragrafdelen er løsbar; «mot <side>» er en instruksjon til mennesket.
    resolution_needed: >
      Behold paragrafkoblingen, men merk raden som tosidig — en lovendring
      alene avgjør ikke om raden fortsatt holder.

# ------------------------------------------------- ikke lovtekst i det hele tatt
#
# Grunnlag som ALDRI kan treffes av en endring i de åpne datasettene, fordi
# kilden ikke ligger der. Å la dem stå i samme mekanisme ville gitt falsk
# trygghet: rader som ser overvåket ut, men ikke er det.

ikke_lovtekst:
  - rows: [HF-01, HF-02]
    basis: rundskriv til folketrygdloven § 5-3 (Helsedirektoratet)
    why: >
      Rundskriv er ikke lov eller sentral forskrift og ligger ikke i de åpne
      arkivene. Rekognoseringen fant dessuten at Helsedirektoratets rundskriv
      til ftrl. § 5-14 fortsatt skriver 16 år der forskriften er endret til 18
      — altså etterslep i rundskrivet. Nettopp dette etterslepet er HF-01s
      påstand, og det er en annen endringskilde enn lovteksten.
    trigger: Må følges som side, ikke som paragraf. Hale-mekanismen, ikke 2b.
    open_question: >
      HF-01 og HF-02 står som UTENFOR fordi grunnlaget er rundskrivet. Men
      rekognoseringen fant at blåreseptforskriften § 8 nå lyder «Barn under 18
      år og minstepensjonister skal ikke betale egenandel» — altså ligger
      aldersendringen også i en forskrift som ER i det åpne arkivet. Hvilken
      bestemmelse som bærer det brede egenandelsfritaket (ftrl. § 5-3, en
      egenandelsforskrift, eller begge) er IKKE avgjort her. Å gjette en
      kobling ville gitt to rader som ser overvåket ut uten å være det.
      Avgjøres ved første Lovdata-oppslag, ikke av oss nå.

  - rows: [HF-05]
    basis: folketrygdloven § 5-3 jf. Stortingets årlige vedtak
    why: >
      Lovparagrafen er løsbar, men den operative verdien (egenandelstaket)
      settes av Stortingets årlige vedtak. Stortingsvedtak ligger i arkivet
      «gjeldende sentrale forskrifter», så dette er antakelig dekket — men
      hvilket vedtak som bærer taket er ikke verifisert.
    trigger: Både paragraf og årlig vedtak. Dobbel kobling, ikke verifisert.

  - rows: [LK-21]
    basis: lanekassen.no (uten-søknad-mekanisme); FOR-2020-04-15-798 §§ 97/98/100
    why: Blandet grunnlag — etatsside og forskrift i samme felt.
    trigger: Forskriftsdelen i 2b, sidedelen i hale.

  - rows: [LK-02, LK-14, LK-15, LK-16, LK-17, LK-18, SKATT-09, SKATT-10,
           HF-03, HF-04, NB-01, NB-02, NB-03, NB-04, NB-05, NB-06, NB-07,
           NB-08, NB-09, NB-10, NB-11, NB-12, NB-13, NB-14, NB-16, NB-24,
           NB-25, NB-26, NB-27, NB-28]
    basis: null
    why: >
      30 rader har tomt legal_basis. De deler seg i tre, og skillet er
      avgjørende: (1) rader som ikke HAR en hjemmel — ISBN/ISSN-praksis fra
      ISBN Norge, etatspraksis ved ID-kontroll, et kundetelefonnummer. De
      skal ikke ha én. (2) rader som er KORRIGERT — HF-03, HF-04 og LK-14
      bærer tidligere feil som historikk, ikke gjeldende rett. (3) rader som
      mangler hjemmel de burde hatt. Bare (3) er et hull å tette, og
      rekognoseringen har ikke avgjort hvilke rader som faller der.
    trigger: >
      Ingen. 41 rader har review_trigger PRAKSIS, og praksis endres uten at
      noen lov gjør det. Disse hører i hale, aldri i 2b.

# --------------------------------------------------------------------- arv
#
# 31 rader har bare «§ x-y» uten lov. Loven må arves fra den første raden i
# samme seksjonsblokk. Det er et markdown-artefakt: i tabellen sto loven i
# første rad og de neste sparte plass.
#
# `section` i YAML-en redder det IKKE — den navngir etat og tema
# («Tolletaten — reisegodskvoter og verdigrenser»), aldri loven. Arven må
# derfor være eksplisitt, som her, og ikke utledes av feltet ved kjøretid.

arv:
  - rows: [AT-02, AT-03, AT-04, AT-05, AT-06, AT-07, AT-08, AT-09, AT-10,
           AT-11, AT-12, AT-13, AT-14, AT-15, AT-16]
    inherits_from: AT-01
    document: lov/2005-06-17-62
    evidence: >
      AT-01 navngir arbeidsmiljøloven § 10-4. AT-10…AT-16 peker på §§ 11-2 til
      11-5, og innholdet (arbeidstid for barn og ungdom) svarer til
      arbeidsmiljølovens kapittel 11. Innholdsmessig bekreftet, ikke slått opp.

  - rows: [TOLL-02, TOLL-03, TOLL-04, TOLL-05, TOLL-06, TOLL-07, TOLL-08,
           TOLL-09, TOLL-10, TOLL-11, TOLL-12, TOLL-13, TOLL-14, TOLL-15,
           TOLL-16, TOLL-17]
    inherits_from: TOLL-01
    document: forskrift/2022-10-27-1901
    evidence: >
      TOLL-01 navngir vareførselsforskriften § 4-1-11. TOLL-13 siterer
      «Begrensningene i § 4-1-11 til § 4-1-13 gjelder ikke …» — en intern
      kryssreferanse til samme forskrift. Sterkeste arvbeviset i registeret.

# --------------------------------------------------- paragrafnormalisering
#
# Registerets presisjon er FINERE enn det Lovdata merker endringer på.
# «§ 4-1-13 første ledd tredje punktum» har tre nivåer; Lovdatas
# data-change-part når to: `/§4-1-13/ledd/1`. Punktum, bokstav og «siste
# punktum» finnes ikke som adresserbart nivå i merkingen vi har sett.
#
# Følgen for 2b: match på paragraf, bruk ledd som avgrensning når begge har
# det, og la punktum/bokstav stå som tekst mennesket leser. Å matche på
# punktum ville gitt tapte treff, ikke presisjon.

ordenstall:
  første: 1
  andre: 2
  annet: 2
  tredje: 3
  fjerde: 4
  femte: 5
  sjette: 6
  sjuende: 7
  syvende: 7

ikke_adresserbart:
  - punktum        # «første ledd tredje punktum» — 8 rader
  - bokstav        # «annet ledd bokstav a» — 3 rader
  - siste punktum  # posisjonsavhengig, endres av selve endringen
  - flere ledd     # «fjerde og femte ledd» (AT-04, AT-06) — uttrekket tar ett
                   # ledd, ikke begge. Ufarlig så lenge matchen skjer på
                   # paragraf og ledd bare er en avgrensning; ville vært en
                   # tapt treff-kilde hvis ledd var påkrevd.

