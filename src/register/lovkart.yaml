# lovkart — forkortelse i registerets legal_basis → dokument hos Lovdata
#
# Registerets `legal_basis` er prosa skrevet for mennesker: «ftrl. § 21-12»,
# «§ 10-4 fjerde ledd», «blåreseptforskriften § 8». Ingen av formene kan slås
# opp maskinelt. Denne fila er oversettelsen 2b trenger, og den finnes ikke i
# Lovdatas åpne datasett — datasettet har tittel og kortnavn per dokument, men
# ingen tabell fra juristforkortelse til dokument-ID.
#
# VERIFISERINGSSTATUS er det viktigste feltet. Det sier hvor IDen kommer fra:
#
#   registerfestet  IDen står ordrett i registerets egen legal_basis for minst
#                   én rad. Registeret har verifisert den mot kilde; høyest
#                   tillit vi har uten å lese Lovdata.
#   korroborert     Bekreftet mot en Lovdata-side i rekognoseringen 2026-10-09,
#                   men via søk — ikke lest direkte. lovdata.no og
#                   api.lovdata.no var sperret av egress-policyen i sesjonen.
#   ubekreftet      IDen er IKKE bekreftet. Står her som hypotese fordi en
#                   tabell med hull er mer ærlig enn en tabell som later som.
#                   MÅ slås opp før bruk.
#
# Ingen rad i denne fila er lest direkte fra Lovdata. Det er en reell
# begrensning, ikke en formalitet: `korroborert` betyr at et søk returnerte en
# Lovdata-URL og en tittel som stemmer, ikke at dokumentet er åpnet.
#
# refid-format: Lovdata adresserer dokumenter som `lov/<dato>-<nr>` og
# `forskrift/<dato>-<nr>`, og paragrafer som `<refid>/§<nr>`. Endringer i Norsk
# Lovtidend er fra 2023 merket ned til ledd:
# `data-change-part="lov/2005-06-17-62/§15-6/ledd/3"`.

schema_version: '1.0'
recon:
  date: '2026-10-09'
  phase: 2b
  method: >
    Alle 118 legal_basis-felt lest ut av src/register/data/*.yaml. IDer hentet
    fra registeret selv der det oppgir dem, ellers korroborert mot Lovdata via
    søk. Lovdata-vertene var utilgjengelige direkte.
  unread_sources:
    - lovdata.no (egress-sperret: 403 på CONNECT)
    - api.lovdata.no (egress-sperret: 403 på CONNECT)

